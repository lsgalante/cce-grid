[package]
name = "cce-grid"
version = "0.1.0"
edition = "2021"

[dependencies]
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "174185f9df9996e505a2e1b351544403d64bf2fa", features = ["markdown"] }
calloop = "0.13.0"
wayland-client = { version = "0.31", features = ["system"] }
log = "0.4"
env_logger = "0.11"
# Dropped desktop images: PNG and JPEG cover what a browser hands over. The
# same pair cce-files and cce-preview already decode with.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cce-vault = { git = "https://github.com/lsgalante/cce-vault.git", rev = "3a7348a77ea6381d63b7358d14baf155637a7e38" }

[dev-dependencies]
tempfile = "3"
