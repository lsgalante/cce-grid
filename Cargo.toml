[package]
name = "cce-grid"
version = "0.1.0"
edition = "2021"

[dependencies]
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "77ff5e4843604c8f2f4e9b0ae04b73c05b4cb4db", features = ["markdown"] }
calloop = "0.13.0"
wayland-client = { version = "0.31", features = ["system"] }
log = "0.4"
env_logger = "0.11"
# Dropped desktop images: PNG and JPEG cover what a browser hands over. The
# same pair cce-files and cce-preview already decode with.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cce-vault = { git = "https://github.com/lsgalante/cce-vault.git", rev = "672948dcacca3b4f17bc74c0a81dc741c4bac9a7" }

[dev-dependencies]
tempfile = "3"
