[package]
name = "cce-grid"
version = "0.1.0"
edition = "2021"

[dependencies]
cce-ui = { git = "https://git.lucas.co/cce-ui.git", rev = "c4b83f53af631b5534f94d0b35bb91c319e2ce26" }
calloop = "0.13.0"
wayland-client = { version = "0.31", features = ["system"] }
log = "0.4"
env_logger = "0.11"
# Dropped desktop images: PNG and JPEG cover what a browser hands over. The
# same pair cce-files and cce-preview already decode with.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
